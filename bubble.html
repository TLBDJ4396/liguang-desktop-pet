<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: "Microsoft YaHei", sans-serif;
  }
  #bubbles {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 4px;
    pointer-events: none;
  }
  .pet-bubble {
    max-width: 280px;
    padding: 10px 16px;
    background: #fff;
    color: #222;
    border: 2px solid #222;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.5);
    text-align: center;
    word-wrap: break-word;
    overflow-wrap: break-word;
    white-space: normal;
    opacity: 0;
    transform: scale(0.8);
    transition: opacity 0.25s ease, transform 0.3s cubic-bezier(.2,1.2,.4,1);
  }
  .pet-bubble.show {
    opacity: 1;
    transform: scale(1);
  }
</style>
</head>
<body>
  <div id="bubbles"></div>
  <script src="bubble.js"></script>
</body>
</html>
